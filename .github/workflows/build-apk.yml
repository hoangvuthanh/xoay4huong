name: Build Ultra-Light Rotate4Way APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK/build-tools/"* | sort -V | tail -n 1)
          PF=$(ls -d "$SDK/platforms/android-"* | sort -V | tail -n 1)
          mkdir -p build/gen build/classes build/dex
          "$BT/aapt2" compile --dir app/src/main/res -o build/res.zip
          "$BT/aapt2" link -o build/u.apk -I "$PF/android.jar" --manifest app/src/main/AndroidManifest.xml --java build/gen build/res.zip
          javac -source 8 -target 8 -encoding UTF-8 -classpath "$PF/android.jar" -d build/classes $(find build/gen app/src/main/java -name "*.java")
          "$BT/d8" --release --lib "$PF/android.jar" --min-api 24 --output build/dex $(find build/classes -name "*.class")
          (cd build/dex && zip -q -u ../u.apk classes.dex)
          "$BT/zipalign" -f -p 4 build/u.apk build/a.apk
          keytool -genkeypair -keystore build/k.jks -storepass rotate4way -alias r4 -keypass rotate4way -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Rotate4Way"
          "$BT/apksigner" sign --ks build/k.jks --ks-pass pass:rotate4way --key-pass pass:rotate4way --out build/Rotate4Way-A10s.apk build/a.apk
          "$BT/apksigner" verify build/Rotate4Way-A10s.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Rotate4Way-A10s-APK
          path: build/Rotate4Way-A10s.apk
